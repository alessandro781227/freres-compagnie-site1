<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">IFAPME — Coming soon — FRERES &amp; cie</title>
<desc id="desc">Annonce graphique en vert et noir pour un nouveau chantier d'aménagement de deux ateliers et trois salles de cours, démarrage prévu le 16 novembre 2026. Illustration graphique, pas une photographie du chantier.</desc>
<defs>
